# After merges to the default branch: propagate docs/versions.json to PLUGIN_VERSION, manifests,
# README table, docs badges, etc. Commit only if something drifted. Does not compile (no game DLLs).
# Commit message includes [skip ci] so this workflow does not loop on its own bot push.
name: Sync mod versions

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-mod-versions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Default: GITHUB_TOKEN. If pushes to the default branch are blocked, set repo secret ADMIN_PUSH_TOKEN
      # (PAT with contents:write), same as update-stats.yml, and use: token: ${{ secrets.ADMIN_PUSH_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PUSH_TOKEN || github.token }}

      - name: Sync from versions.json (no build)
        shell: pwsh
        run: ./scripts/pre-push-build.ps1 -All -SyncOnly

      - name: Verify version consistency
        run: python3 scripts/verify-version-consistency.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/stage-version-sync-files.py
          if git diff --staged --quiet; then
            echo "No version drift — nothing to commit."
            exit 0
          fi
          git commit -m "chore: sync mod versions from versions.json [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
