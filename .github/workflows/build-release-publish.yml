# =============================================================================
# Mod CI/CD Pipeline: Package → GitHub Release → Thunderstore + Nexus (Manual)
# =============================================================================
# TRIGGER: Manual workflow dispatch - select which mod to release/publish
#
# IMPORTANT: This workflow builds mod DLLs on a self-hosted runner (labels: self-hosted, Linux, X64, sunhaven).
# It then packages the produced DLLs for GitHub/Thunderstore/Nexus.
#
# WHAT IT DOES:
#   1. Packages the Thunderstore-ready zip (manifest.json, README, icon, DLL(s); The Vault also includes TheVault.Abstractions.dll)
#   2. Creates a GitHub Release with the zip attached (optional)
#   3. Optionally publishes to Thunderstore (manual checkbox)
#   4. Optionally uploads to Nexus Mods (manual checkbox; needs NEXUSMODS_API_KEY)
#      Haven's Almanac: Nexus is always skipped; workflow logs a positive note; no Discord pings.
#
# Version / release: see docs/VERSION_AND_RELEASE.md — bump via scripts/pre-push-build.ps1;
# CI runs scripts/verify-version-consistency.py before build.
#
# SETUP REQUIRED:
#   1. Thunderstore: THUNDERSTORE_TOKEN (Service Account token)
#   2. Nexus Mods (optional): NEXUSMODS_API_KEY from https://www.nexusmods.com/users/myaccount?tab=api
#      Add nexus_file_group_id to docs/versions.json for mods you want to upload to Nexus
#      Use Nexus-Mods/upload-action v1.0.0-beta.3+ (Nexus API wraps JSON in { data }; beta.2 throws on .length)
#
#   NEXUS: "Failed to update Mod file: 500 - <!DOCTYPE html>"
#      That is the final POST /v3/mod-file-update-groups/{id}/versions step (attach upload to the mod).
#      Multipart upload already succeeded; the HTML body is Nexus’s generic error page — usually server-side.
#      - Retry the workflow later (v3 API is unstable / “evaluation only” per Nexus).
#      - Verify nexus_file_group_id matches the mod’s Files tab → API info → file group id (not guessed).
#      - Use an API key with upload permission; avoid re-publishing the same version if the site rejects it.
#      - Enable ACTIONS_STEP_DEBUG on the repo for verbose upload-action logs.
#   NEXUS: "Cannot read properties of undefined (reading 'length')"
#      That is POST /v3/uploads/multipart responding 201 with a body missing `data.part_presigned_urls`.
#      The action destructures `part_presigned_urls.length` immediately after, which blows up.
#      Upload step is now wrapped in 4 attempts with continue-on-error and 30s / 2min / 5min backoff,
#      and a step-summary message distinguishes "flaked but recovered on retry N" from "all 4 failed".
#      If all 4 fail: GitHub Release + Thunderstore still publish; bump patch version + rerun Nexus-only,
#      or upload the dist zip manually via the Nexus Files tab.
#   3. The Vault breaking vault saves: TheVault/SAVE_COMPATIBILITY.md — set vault_save_breaking + banner in versions.json,
#      README callout, VaultSaveCompatibility.cs, thunderstore README; CI prepends banner to published description/changelog.
# =============================================================================

name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'Which mod to release'
        required: true
        type: choice
        options:
          - all
          - havensbirthright
          - sunhavenmuseumutilitytracker
          - squirrelsbirthdayreminder
          - sunhaventodo
          - thevault
          - havendevtools
          - senpaischest
          - havensalmanac
          - fasterraces
          - trinketfortune
          - cropoptimizer
          - havensrespec
      publish_thunderstore:
        description: 'Publish to Thunderstore after release?'
        required: true
        type: boolean
        default: true
      publish_nexus:
        description: 'Upload to Nexus Mods? (requires NEXUSMODS_API_KEY + nexus_file_group_id in versions.json)'
        required: false
        type: boolean
        default: false
      create_github_release:
        description: 'Create GitHub Release?'
        required: true
        type: boolean
        default: true
      test_discord:
        description: 'Test Discord notification only (fake mod, no GitHub/Thunderstore release)'
        required: false
        type: boolean
        default: false
      publish_discord_only:
        description: 'Publish to Discord only (real mod data, no GitHub/Thunderstore/Nexus)'
        required: false
        type: boolean
        default: false
  release:
    types: [published]

env:
  THUNDERSTORE_NAMESPACE: "AzraelGodKing"
  THUNDERSTORE_COMMUNITY: "sun-haven"
  THUNDERSTORE_CATEGORIES: "mods"
  THUNDERSTORE_DEPS: "BepInEx-BepInExPack@5.4.2100"

jobs:
  # --------------------------------------------------------------------
  # SETUP — Determine which mod(s) to release
  # --------------------------------------------------------------------
  setup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version consistency (versions.json vs PLUGIN_VERSION vs manifest)
        run: python3 scripts/verify-version-consistency.py

      - name: Set mod matrix
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.test_discord }}" == "true" ]; then
            echo 'matrix=["test_discord"]' >> "$GITHUB_OUTPUT"
          else
            MOD_KEY="${{ github.event.inputs.mod }}"
            if [ "$MOD_KEY" == "all" ]; then
              echo "matrix=$(jq -c '[.[].modKey]' scripts/mod-matrix.json)" >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$MOD_KEY\"]" >> "$GITHUB_OUTPUT"
            fi
          fi

  # --------------------------------------------------------------------
  # BUILD — Compile selected mod(s) with .NET on self-hosted Linux runner
  # --------------------------------------------------------------------
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: setup
    runs-on: [self-hosted, Linux, X64, sunhaven]
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        if: matrix.mod != 'test_discord'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
        env:
          # Self-hosted Linux runners run as non-root; /usr/share/dotnet is not writable.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
          DOTNET_ROOT: ${{ runner.temp }}/dotnet

      - name: Set build targets
        if: matrix.mod != 'test_discord'
        id: build_config
        shell: bash
        run: |
          MOD_KEY="${{ matrix.mod }}"
          MOD_JSON="$(jq -c --arg key "$MOD_KEY" '.[] | select(.modKey == $key)' scripts/mod-matrix.json)"
          if [ -z "$MOD_JSON" ]; then
            echo "❌ Unknown mod: $MOD_KEY"
            exit 1
          fi
          MOD_DIR="$(echo "$MOD_JSON" | jq -r '.modDir')"
          DLL_NAME="$(echo "$MOD_JSON" | jq -r '.dllName')"
          CSPROJ="$(echo "$MOD_JSON" | jq -r '.csproj')"

          echo "mod_dir=$MOD_DIR" >> "$GITHUB_OUTPUT"
          echo "dll_name=$DLL_NAME" >> "$GITHUB_OUTPUT"
          echo "csproj=$CSPROJ" >> "$GITHUB_OUTPUT"

      - name: Build mod
        if: matrix.mod != 'test_discord'
        shell: bash
        env:
          BEPINEX_PATH: /sunhaven/BepInEx
          MANAGED_PATH: "/sunhaven/Sun Haven_Data/Managed"
        run: |
          set -euo pipefail
          dotnet restore "${{ steps.build_config.outputs.csproj }}"
          dotnet build "${{ steps.build_config.outputs.csproj }}" -c Release --nologo \
            -p:BepInExPath="$BEPINEX_PATH" \
            -p:ManagedPath="$MANAGED_PATH" \
            -p:SunhavenCopyToBepInExPlugins=false

      - name: Collect build outputs
        if: matrix.mod != 'test_discord'
        shell: bash
        run: |
          set -euo pipefail
          MOD_DIR="${{ steps.build_config.outputs.mod_dir }}"
          DLL_NAME="${{ steps.build_config.outputs.dll_name }}"
          SRC_DLL="$MOD_DIR/bin/Release/net48/$DLL_NAME.dll"
          DEST_DIR="builds/$MOD_DIR"

          mkdir -p "$DEST_DIR"
          if [ ! -f "$SRC_DLL" ]; then
            echo "❌ Built DLL not found: $SRC_DLL"
            exit 1
          fi

          cp "$SRC_DLL" "$DEST_DIR/"
          echo "📄 Copied: $SRC_DLL -> $DEST_DIR/"

          if [ "${{ matrix.mod }}" = "thevault" ]; then
            # TheVault.Abstractions.csproj targets netstandard2.0 (not net48)
            ABS_SRC="TheVault.Abstractions/bin/Release/netstandard2.0/TheVault.Abstractions.dll"
            if [ -f "$ABS_SRC" ]; then
              cp "$ABS_SRC" "$DEST_DIR/"
              echo "📄 Copied: $ABS_SRC -> $DEST_DIR/"
            else
              echo "❌ Missing required dependency: $ABS_SRC"
              exit 1
            fi
          fi

      - name: Upload built DLL artifact
        if: matrix.mod != 'test_discord'
        uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.mod }}
          path: builds/${{ steps.build_config.outputs.mod_dir }}/*.dll
          if-no-files-found: error

  # --------------------------------------------------------------------
  # RELEASE — Package, release, and optionally publish each mod
  # --------------------------------------------------------------------
  release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - setup
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      # ------------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. LOAD MOD CONFIG
      # ------------------------------------------------------------------
      - name: Set mod configuration
        id: config
        run: |
          MOD_KEY="${{ matrix.mod }}"

          if [ "$MOD_KEY" == "test_discord" ]; then
            echo "json_key=test_discord" >> "$GITHUB_OUTPUT"
            echo "mod_dir=TestDiscord" >> "$GITHUB_OUTPUT"
            echo "dll_name=TestDiscord" >> "$GITHUB_OUTPUT"
            echo "thunderstore_name=TestDiscord" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-test" >> "$GITHUB_OUTPUT"
            echo "display_name=Test Discord Notification" >> "$GITHUB_OUTPUT"
            echo "description=Test run" >> "$GITHUB_OUTPUT"
            echo "changelog=Workflow test. No GitHub Release or Thunderstore publish." >> "$GITHUB_OUTPUT"
            echo "skip_discord_for_almanac=false" >> "$GITHUB_OUTPUT"
            echo "Test mode: fake mod data set"
            exit 0
          fi

          MOD_JSON="$(jq -c --arg key "$MOD_KEY" '.[] | select(.modKey == $key)' scripts/mod-matrix.json)"
          if [ -z "$MOD_JSON" ]; then
            echo "❌ Unknown mod: $MOD_KEY"
            exit 1
          fi
          JSON_KEY="$(echo "$MOD_JSON" | jq -r '.jsonKey')"
          MOD_DIR="$(echo "$MOD_JSON" | jq -r '.modDir')"
          DLL_NAME="$(echo "$MOD_JSON" | jq -r '.dllName')"
          THUNDERSTORE_NAME="$(echo "$MOD_JSON" | jq -r '.thunderstoreName')"

          # Read version, name, description, changelog, and links from versions.json
          VERSION=$(jq -r ".[\"$JSON_KEY\"].version" docs/versions.json)
          MOD_DISPLAY_NAME=$(jq -r ".[\"$JSON_KEY\"].name" docs/versions.json)
          MOD_DESCRIPTION=$(jq -r ".[\"$JSON_KEY\"].description" docs/versions.json)
          CHANGELOG=$(jq -r ".[\"$JSON_KEY\"].changelog" docs/versions.json)
          VAULT_SAVE_BREAKING=$(jq -r ".[\"$JSON_KEY\"].vault_save_breaking // false" docs/versions.json)
          VAULT_BREAKING_BANNER=$(jq -r ".[\"$JSON_KEY\"].vault_breaking_banner // \"\"" docs/versions.json)
          NEXUS_URL=$(jq -r ".[\"$JSON_KEY\"].nexus // \"\"" docs/versions.json)
          NEXUS_FILE_GROUP_ID=$(jq -r ".[\"$JSON_KEY\"].nexus_file_group_id // empty" docs/versions.json)
          THUNDERSTORE_URL=$(jq -r ".[\"$JSON_KEY\"].thunderstore // \"\"" docs/versions.json)

          if [ -z "$NEXUS_FILE_GROUP_ID" ] || [ "$NEXUS_FILE_GROUP_ID" == "null" ]; then
            NEXUS_FILE_GROUP_ID=""
            if [ -n "$NEXUS_URL" ] && [ "$NEXUS_URL" != "null" ]; then
              NEXUS_FILE_GROUP_ID=$(echo "$NEXUS_URL" | sed -n 's|.*/mods/\([0-9]*\)$|\1|p')
            fi
          fi

          echo "json_key=$JSON_KEY" >> "$GITHUB_OUTPUT"
          echo "mod_dir=$MOD_DIR" >> "$GITHUB_OUTPUT"
          echo "dll_name=$DLL_NAME" >> "$GITHUB_OUTPUT"
          echo "thunderstore_name=$THUNDERSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display_name=$MOD_DISPLAY_NAME" >> "$GITHUB_OUTPUT"
          echo "description=$MOD_DESCRIPTION" >> "$GITHUB_OUTPUT"
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "nexus_url=$NEXUS_URL" >> "$GITHUB_OUTPUT"
          echo "nexus_file_group_id=$NEXUS_FILE_GROUP_ID" >> "$GITHUB_OUTPUT"
          echo "thunderstore_url=$THUNDERSTORE_URL" >> "$GITHUB_OUTPUT"
          echo "skip_discord_for_almanac=false" >> "$GITHUB_OUTPUT"

          echo "📦 Packaging: $MOD_DISPLAY_NAME v$VERSION"
          echo "   Description: $MOD_DESCRIPTION"
          echo "   Looking for: builds/$MOD_DIR/$DLL_NAME.dll"

      - name: Download built DLL artifact
        if: github.event.inputs.publish_discord_only != 'true' && matrix.mod != 'test_discord'
        uses: actions/download-artifact@v4
        with:
          name: built-${{ matrix.mod }}
          path: builds/${{ steps.config.outputs.mod_dir }}

      # ------------------------------------------------------------------
      # 3. VERSION CHECK — Skip if current version already released
      # ------------------------------------------------------------------
      - name: Check version against last release
        id: version_check
        if: github.event.inputs.publish_discord_only != 'true'
        run: |
          THUNDERSTORE_NAME="${{ steps.config.outputs.thunderstore_name }}"
          CURRENT_VERSION="${{ steps.config.outputs.version }}"
          MOD_DISPLAY_NAME="${{ steps.config.outputs.display_name }}"

          if [ "$THUNDERSTORE_NAME" == "TestDiscord" ]; then
            echo "Test mode: skipping version check, proceeding"
            echo "version_unchanged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch releases, filter by mod prefix, get latest by published_at, parse version from tag
          LAST_RELEASE_JSON=$(curl -sSf -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases?per_page=100" | \
            jq -r --arg prefix "${THUNDERSTORE_NAME}-v" '[.[] | select(.tag_name | startswith($prefix))] | sort_by(.published_at) | reverse | .[0] // empty')

          if [ -z "$LAST_RELEASE_JSON" ] || [ "$LAST_RELEASE_JSON" == "null" ]; then
            echo "No previous release found for $THUNDERSTORE_NAME - proceeding with release"
            echo "version_unchanged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_VERSION=$(echo "$LAST_RELEASE_JSON" | jq -r '.tag_name | split("-v")[1]')
          echo "Last released version: $LAST_VERSION"
          echo "Current version:       $CURRENT_VERSION"

          if [ "$LAST_VERSION" == "$CURRENT_VERSION" ]; then
            echo "version_unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed ($LAST_VERSION -> $CURRENT_VERSION) - proceeding with release"
            echo "version_unchanged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No version change - skipping release
        if: github.event.inputs.publish_discord_only != 'true' && steps.version_check.outputs.version_unchanged == 'true'
        run: |
          echo "✅ No Version Change - ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }} already released, skipping"

      # ------------------------------------------------------------------
      # 4. PACKAGE — Assemble Thunderstore-compatible zip
      # ------------------------------------------------------------------
      - name: Package mod for distribution
        if: github.event.inputs.publish_discord_only != 'true' && steps.version_check.outputs.version_unchanged != 'true'
        env:
          PACKAGE_MANIFEST_DESCRIPTION: ${{ steps.config.outputs.description }}
        run: |
          mkdir -p dist/package

          if [ "${{ matrix.mod }}" == "test_discord" ]; then
            echo "Test run - no real package" > dist/package/readme.txt
            cd dist/package
            zip -r "../TestDiscord-0.0.0-test.zip" .
            echo "Minimal test package created: TestDiscord-0.0.0-test.zip"
            exit 0
          fi

          # Look for pre-built DLL in builds folder
          DLL_PATH="builds/${{ steps.config.outputs.mod_dir }}/${{ steps.config.outputs.dll_name }}.dll"

          if [ ! -f "$DLL_PATH" ]; then
            echo "❌ DLL not found at: $DLL_PATH"
            echo ""
            echo "Please build your mod locally and commit the DLL:"
            echo "  1. Build in Visual Studio/Rider"
            echo "  2. Copy DLL to: builds/${{ steps.config.outputs.mod_dir }}/"
            echo "  3. git add builds/ && git commit -m 'Update ${{ steps.config.outputs.dll_name }} build' && git push"
            echo "  4. Re-run this workflow"
            exit 1
          fi

          echo "📄 Found DLL: $DLL_PATH"
          cp "$DLL_PATH" dist/package/

          # The Vault loads the abstractions assembly from the same folder; ship it in the zip.
          if [ "${{ matrix.mod }}" = "thevault" ]; then
            ABS_PATH="builds/${{ steps.config.outputs.mod_dir }}/TheVault.Abstractions.dll"
            if [ -f "$ABS_PATH" ]; then
              cp "$ABS_PATH" dist/package/
              echo "📄 Also packaged: $ABS_PATH"
            else
              echo "❌ The Vault Thunderstore package requires TheVault.Abstractions.dll next to TheVault.dll"
              echo "   Expected: $ABS_PATH"
              echo "   Build TheVault.csproj and copy both DLLs to builds/${{ steps.config.outputs.mod_dir }}/"
              exit 1
            fi
          fi

          # Use thunderstore folder from mod directory
          THUNDERSTORE_DIR="${{ steps.config.outputs.mod_dir }}/thunderstore"

          echo "📁 Using Thunderstore assets from: $THUNDERSTORE_DIR"

          # Copy Thunderstore metadata files
          if [ -f "$THUNDERSTORE_DIR/manifest.json" ]; then
            cp "$THUNDERSTORE_DIR/manifest.json" dist/package/
          else
            echo "⚠️ No manifest.json found - creating minimal one"
            cat > dist/package/manifest.json << EOF
          {
            "name": "${{ steps.config.outputs.thunderstore_name }}",
            "version_number": "${{ steps.config.outputs.version }}",
            "website_url": "",
            "description": "${{ steps.config.outputs.description }}",
            "dependencies": ["BepInEx-BepInExPack-5.4.2100"]
          }
          EOF
          fi

          ICON_SRC=""
          if [ -f "$THUNDERSTORE_DIR/icon.png" ]; then
            ICON_SRC="$THUNDERSTORE_DIR/icon.png"
          elif [ -f "builds/${{ steps.config.outputs.mod_dir }}/icon.png" ]; then
            ICON_SRC="builds/${{ steps.config.outputs.mod_dir }}/icon.png"
          fi
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" dist/package/icon.png
            echo "📷 icon.png from: $ICON_SRC"
          else
            echo "❌ icon.png is required for Thunderstore (put it in $THUNDERSTORE_DIR or builds/${{ steps.config.outputs.mod_dir }}/)"
            exit 1
          fi

          if [ -f "$THUNDERSTORE_DIR/README.md" ]; then
            cp "$THUNDERSTORE_DIR/README.md" dist/package/
          elif [ -f "${{ steps.config.outputs.mod_dir }}/README.md" ]; then
            cp "${{ steps.config.outputs.mod_dir }}/README.md" dist/package/README.md
            echo "📄 Using ${{ steps.config.outputs.mod_dir }}/README.md as package readme"
          fi

          # Thunderstore manifest description matches publish text (incl. vault breaking banner from versions.json)
          if [ -f dist/package/manifest.json ] && command -v jq >/dev/null 2>&1; then
            jq --arg d "$PACKAGE_MANIFEST_DESCRIPTION" '.description = $d' dist/package/manifest.json > dist/package/manifest.json.__new__ \
              && mv dist/package/manifest.json.__new__ dist/package/manifest.json
            echo "📋 manifest description synced to CI publish string"
          fi

          # Update the version in manifest.json to match versions.json
          cd dist/package
          if [ -f manifest.json ]; then
            sed -i "s/\"version_number\": \".*\"/\"version_number\": \"${{ steps.config.outputs.version }}\"/" manifest.json
            echo "📋 manifest.json contents:"
            cat manifest.json
          fi

          # Create the zip
          ZIP_NAME="${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip"
          zip -r "../$ZIP_NAME" .

          echo "✅ Package created: $ZIP_NAME"
          ls -lh "../$ZIP_NAME"

      # ------------------------------------------------------------------
      # 5. GITHUB RELEASE (Optional)
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        if: github.event.inputs.publish_discord_only != 'true' && github.event.inputs.create_github_release == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.config.outputs.thunderstore_name }}-v${{ steps.config.outputs.version }}"
          name: "${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}"
          body: |
            ## ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}

            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Installation
            - **Thunderstore**: Install via r2modman or Thunderstore app
            - **Nexus**: Download the zip below and extract to your BepInEx/plugins folder
            - **Manual**: Extract the DLL to `Sun Haven/BepInEx/plugins/`
          files: |
            dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip
          draft: false
          prerelease: false

      # ------------------------------------------------------------------
      # 5b. NEXUS MODS UPLOAD (optional)
      # ------------------------------------------------------------------
      - name: Haven's Almanac — Nexus skipped (Thunderstore & GitHub only)
        if: github.event.inputs.publish_discord_only != 'true' && matrix.mod == 'havensalmanac' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true'
        run: |
          echo "⭐ Haven's Almanac is not on Nexus Mods yet — Nexus upload is intentionally skipped."
          echo "   Releases still go through GitHub and Thunderstore. Thanks for shipping the Almanac! 📚✨"

      - name: Nexus upload — verify zip and ids
        if: github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        run: |
          ZIP="dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip"
          echo "file_group_id=${{ steps.config.outputs.nexus_file_group_id }}"
          echo "version=${{ steps.config.outputs.version }}"
          echo "zip=$ZIP"
          test -f "$ZIP" || { echo "::error::Missing $ZIP"; exit 1; }
          ls -lh "$ZIP"
          echo "nexus_display_name=${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}.zip"

      # Nexus v3 API is marked "evaluation only" and intermittently returns 201 with an empty body
      # (action crashes with: Cannot read properties of undefined (reading 'length') on
      # part_presigned_urls). Each attempt is continue-on-error so GitHub Release + Thunderstore
      # publish are not held hostage by a Nexus flake. Backoff: 30s -> 2min -> 5min (~7.5 min worst case).
      - name: Upload to Nexus Mods (attempt 1)
        id: nexus_upload_1
        if: github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.3
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ steps.config.outputs.nexus_file_group_id }}
          filename: dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip
          version: ${{ steps.config.outputs.version }}
          display_name: ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}.zip
          description: |
            ${{ steps.config.outputs.description }}

            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Installation
            Download this ZIP and extract the contents to your Sun Haven BepInEx/plugins folder.

            If Nexus displays an alphanumeric file label, the upload is still a ZIP package.
          file_category: main

      - name: Nexus retry backoff (30s)
        if: steps.nexus_upload_1.outcome == 'failure' && github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        run: |
          echo "::warning title=Nexus upload attempt 1 failed::Nexus v3 flaked (likely 201 with empty body). Sleeping 30s before retry 1/3."
          sleep 30

      - name: Upload to Nexus Mods (attempt 2)
        id: nexus_upload_2
        if: steps.nexus_upload_1.outcome == 'failure' && github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.3
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ steps.config.outputs.nexus_file_group_id }}
          filename: dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip
          version: ${{ steps.config.outputs.version }}
          display_name: ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}.zip
          description: |
            ${{ steps.config.outputs.description }}

            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Installation
            Download this ZIP and extract the contents to your Sun Haven BepInEx/plugins folder.

            If Nexus displays an alphanumeric file label, the upload is still a ZIP package.
          file_category: main

      - name: Nexus retry backoff (2 min)
        if: steps.nexus_upload_1.outcome == 'failure' && steps.nexus_upload_2.outcome == 'failure' && github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        run: |
          echo "::warning title=Nexus upload attempt 2 failed::Sleeping 2 min before retry 2/3."
          sleep 120

      - name: Upload to Nexus Mods (attempt 3)
        id: nexus_upload_3
        if: steps.nexus_upload_1.outcome == 'failure' && steps.nexus_upload_2.outcome == 'failure' && github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.3
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ steps.config.outputs.nexus_file_group_id }}
          filename: dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip
          version: ${{ steps.config.outputs.version }}
          display_name: ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}.zip
          description: |
            ${{ steps.config.outputs.description }}

            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Installation
            Download this ZIP and extract the contents to your Sun Haven BepInEx/plugins folder.

            If Nexus displays an alphanumeric file label, the upload is still a ZIP package.
          file_category: main

      - name: Nexus retry backoff (5 min)
        if: steps.nexus_upload_1.outcome == 'failure' && steps.nexus_upload_2.outcome == 'failure' && steps.nexus_upload_3.outcome == 'failure' && github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        run: |
          echo "::warning title=Nexus upload attempt 3 failed::Sleeping 5 min before final retry 3/3."
          sleep 300

      - name: Upload to Nexus Mods (attempt 4 — final)
        id: nexus_upload_4
        if: steps.nexus_upload_1.outcome == 'failure' && steps.nexus_upload_2.outcome == 'failure' && steps.nexus_upload_3.outcome == 'failure' && github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.3
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ steps.config.outputs.nexus_file_group_id }}
          filename: dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip
          version: ${{ steps.config.outputs.version }}
          display_name: ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}.zip
          description: |
            ${{ steps.config.outputs.description }}

            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Installation
            Download this ZIP and extract the contents to your Sun Haven BepInEx/plugins folder.

            If Nexus displays an alphanumeric file label, the upload is still a ZIP package.
          file_category: main

      - name: Nexus upload summary
        if: always() && github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        env:
          NEXUS_OUTCOME_1: ${{ steps.nexus_upload_1.outcome }}
          NEXUS_OUTCOME_2: ${{ steps.nexus_upload_2.outcome }}
          NEXUS_OUTCOME_3: ${{ steps.nexus_upload_3.outcome }}
          NEXUS_OUTCOME_4: ${{ steps.nexus_upload_4.outcome }}
        run: |
          WHICH=""
          for i in 1 2 3 4; do
            VAR="NEXUS_OUTCOME_$i"
            OUT="${!VAR:-skipped}"
            if [ "$OUT" = "success" ]; then
              WHICH="$i"
              break
            fi
          done

          {
            echo "## Nexus upload — ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}"
            echo ""
            if [ -n "$WHICH" ]; then
              echo "✅ Uploaded on attempt ${WHICH}/4."
            else
              echo "⚠️ All 4 Nexus upload attempts failed."
              echo ""
              echo "Nexus v3 API is marked \`evaluation only\` and intermittently returns 201 OK with an empty body (\`part_presigned_urls\` undefined), which makes \`Nexus-Mods/upload-action\` throw \`Cannot read properties of undefined (reading 'length')\`. This is a Nexus-side issue — the rest of this release (GitHub Release + Thunderstore + Discord) completed normally."
              echo ""
              echo "**To retry Nexus only:**"
              echo "1. Bump the patch version in \`docs/versions.json\` and rebuild (local \`scripts/pre-push-build.ps1\`), OR upload the zip manually via the Nexus Mods website → Files tab."
              echo "2. If bumping, re-run **Release & Publish** with \`publish_nexus=true\`, \`publish_thunderstore=false\`, \`create_github_release=false\`."
              echo ""
              echo "Release zip available as a workflow artifact: \`dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # 5c. NOTIFY DISCORD (when we created a release in this workflow run)
      # ------------------------------------------------------------------
      - name: Notify Discord (release created by workflow)
        if: github.event.inputs.publish_discord_only != 'true' && github.event.inputs.create_github_release == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.skip_discord_for_almanac != 'true'
        uses: AzraelGodKing/Discord_Release@main
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "2105893"
          username: "Sun Haven Mods"
          reduce_headings: true
          title: "${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}"
          body: |
            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Download
            - **Nexus Mods**: ${{ steps.config.outputs.nexus_url }}
            - **Thunderstore**: ${{ steps.config.outputs.thunderstore_url }}
            - **GitHub Release**: Download the zip below and extract to BepInEx/plugins
            - **Manual**: Extract the DLL to `Sun Haven/BepInEx/plugins/`
          thumbnail_url: "https://raw.githubusercontent.com/${{ github.repository }}/main/${{ steps.config.outputs.mod_dir }}/thunderstore/icon.png"

      # ------------------------------------------------------------------
      # 6. THUNDERSTORE PUBLISH (Manual opt-in)
      # ------------------------------------------------------------------
      - name: Publish to Thunderstore
        if: github.event.inputs.publish_discord_only != 'true' && github.event.inputs.publish_thunderstore == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true'
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          namespace: ${{ env.THUNDERSTORE_NAMESPACE }}
          name: ${{ steps.config.outputs.thunderstore_name }}
          description: ${{ steps.config.outputs.description }}
          version: ${{ steps.config.outputs.version }}
          community: ${{ env.THUNDERSTORE_COMMUNITY }}
          repo: thunderstore.io
          categories: |
            ${{ env.THUNDERSTORE_CATEGORIES }}
          deps: ${{ env.THUNDERSTORE_DEPS }}
          file: dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip

      # ------------------------------------------------------------------
      # 7. TEST MODE — Post to Discord only (no GitHub Release / Thunderstore)
      # Randomly picks a mod to simulate so the test looks realistic
      # ------------------------------------------------------------------
      - name: Pick random mod for test
        if: github.event.inputs.publish_discord_only != 'true' && github.event.inputs.test_discord == 'true'
        id: test_mod
        run: |
          mapfile -t MODS < <(jq -r '.[] | "\(.jsonKey):\(.modDir)"' scripts/mod-matrix.json)
          IDX=$((RANDOM % ${#MODS[@]}))
          ENTRY="${MODS[$IDX]}"
          JSON_KEY="${ENTRY%%:*}"
          MOD_DIR="${ENTRY##*:}"
          NAME=$(jq -r ".[\"$JSON_KEY\"].name" docs/versions.json)
          VERSION=$(jq -r ".[\"$JSON_KEY\"].version" docs/versions.json)
          CHANGELOG=$(jq -r ".[\"$JSON_KEY\"].changelog" docs/versions.json)
          echo "title=Test – $NAME v$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "### Changes"
            echo "$CHANGELOG"
            echo ""
            echo "— *Test run. No real release.*"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "icon_url=https://raw.githubusercontent.com/${{ github.repository }}/main/$MOD_DIR/thunderstore/icon.png" >> "$GITHUB_OUTPUT"

      - name: Post test notification to Discord
        if: github.event.inputs.publish_discord_only != 'true' && github.event.inputs.test_discord == 'true'
        uses: AzraelGodKing/Discord_Release@main
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: ${{ steps.test_mod.outputs.title }}
          body: ${{ steps.test_mod.outputs.body }}
          thumbnail_url: ${{ steps.test_mod.outputs.icon_url }}
          username: "Sun Haven Mods"

      # ------------------------------------------------------------------
      # 8. DISCORD-ONLY PUBLISH (real mod data, no GitHub/Thunderstore/Nexus)
      # ------------------------------------------------------------------
      - name: Publish to Discord only
        if: github.event.inputs.publish_discord_only == 'true' && github.event.inputs.test_discord != 'true' && steps.config.outputs.skip_discord_for_almanac != 'true'
        uses: AzraelGodKing/Discord_Release@main
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "2105893"
          username: "Sun Haven Mods"
          reduce_headings: true
          title: "${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}"
          body: |
            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Download
            - **Nexus Mods**: ${{ steps.config.outputs.nexus_url }}
            - **Thunderstore**: ${{ steps.config.outputs.thunderstore_url }}
          thumbnail_url: "https://raw.githubusercontent.com/${{ github.repository }}/main/${{ steps.config.outputs.mod_dir }}/thunderstore/icon.png"

  # --------------------------------------------------------------------
  # NOTIFY DISCORD — When a release is published (triggered by release event)
  # Uses mod icon from thunderstore folder (raw GitHub URL)
  # --------------------------------------------------------------------
  notify_discord:
    if: ${{ github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'HavensAlmanac-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Set mod icon URL
        id: icon
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PREFIX="${TAG%-v*}"
          case "$PREFIX" in
            HavensBirthright)           DIR="HavensBirthright" ;;
            SMUT)                       DIR="SunHavenMuseumUtilityTracker" ;;
            SquirrelsBirthdayReminder)  DIR="BirthdayReminder" ;;
            SunHavenTodo)               DIR="SunhavenTodo" ;;
            TheVault)                   DIR="TheVault" ;;
            HavenDevTools)              DIR="HavenDevTools" ;;
            SenpaisChest)               DIR="SenpaisChest" ;;
            HavensAlmanac)              DIR="HavensAlmanac" ;;
            FasterRaces)                DIR="FasterRaces" ;;
            TrinketFortune)             DIR="TrinketFortune" ;;
            CropOptimizer)              DIR="CropOptimizer" ;;
            HavensRespec)               DIR="HavensRespec" ;;
            *)                          DIR="" ;;
          esac
          if [ -n "$DIR" ]; then
            echo "url=https://raw.githubusercontent.com/${{ github.repository }}/main/$DIR/thunderstore/icon.png" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release to Discord
        uses: AzraelGodKing/Discord_Release@main
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "2105893"
          username: "Sun Haven Mods"
          reduce_headings: true
          thumbnail_url: ${{ steps.icon.outputs.url }}
