# =============================================================================
# Release & Publish — SunhavenMod
# =============================================================================
# - PR: build all mods on self-hosted runner (compile gate only).
# - workflow_dispatch: version (optional bump) → build → package → optional publish.
#
# docs/VERSION_AND_RELEASE.md — version source of truth; setup runs verify script.
# Nexus: v3 upload API is evaluation-only; we retry with backoff and require the
# final attempt to succeed when publish_nexus=true (no silent green on failure).
#
# `builds/` in this workflow = ephemeral path on the GitHub runner only: the build
# job copies `bin/Release/...` outputs into `builds/<ModDir>/`, upload-artifact
# stores them, the release job downloads back into the same path, then packaging
# reads DLLs from there. Nothing is read from a committed `builds/` tree (.gitignore).
# See builds/README.md.
# =============================================================================

name: Release & Publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + package + artifact only; no external publish)'
        required: true
        type: boolean
        default: false
      build_only:
        description: 'Build only (DLL artifacts; skip package/release/publish job)'
        required: false
        type: boolean
        default: false
      bump_version:
        description: 'Bump semver in versions.json before build (none = use branch as-is)'
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      release_changelog:
        description: 'Optional changelog written to versions.json before bump (mod or all)'
        required: false
        type: string
        default: ''
      mod:
        description: 'Which mod to release'
        required: true
        type: choice
        options:
          - all
          - havensbirthright
          - sunhavenmuseumutilitytracker
          - squirrelsbirthdayreminder
          - sunhaventodo
          - thevault
          - havendevtools
          - senpaischest
          - havensalmanac
          - fasterraces
          - trinketfortune
          - cropoptimizer
          - havensrespec
          - giftingassistant
      publish_thunderstore:
        description: 'Publish to Thunderstore?'
        required: true
        type: boolean
        default: false
      publish_nexus:
        description: 'Upload to Nexus Mods?'
        required: false
        type: boolean
        default: false
      create_github_release:
        description: 'Create GitHub Release?'
        required: true
        type: boolean
        default: false
      release_anyway:
        description: 'Ignore upstream version gate and continue package/publish'
        required: false
        type: boolean
        default: false
      test_discord:
        description: 'Test Discord notification only'
        required: false
        type: boolean
        default: false
      publish_discord_only:
        description: 'Discord only (no package/publish from this job)'
        required: false
        type: boolean
        default: false
      ignore_discord_notify:
        description: 'Skip all Discord steps for this workflow_dispatch run'
        required: false
        type: boolean
        default: false

# One dispatch run per branch/ref per mod choice (avoid racing Thunderstore/GitHub Release).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('mod-{0}', github.event.inputs.mod) || format('pr-{0}', github.event.pull_request.number || 'na') }}
  cancel-in-progress: false

env:
  THUNDERSTORE_NAMESPACE: "AzraelGodKing"
  THUNDERSTORE_COMMUNITY: "sun-haven"
  THUNDERSTORE_CATEGORIES: "mods"
  THUNDERSTORE_DEPS: "BepInEx-BepInExPack@5.4.2100"

jobs:
  validate-localization:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate localization strings
        shell: pwsh
        run: ./scripts/localization/validate-localization.ps1

  # ---------------------------------------------------------------------------
  # Version — optional bump + sync before build (dispatch only)
  # Order: Version → setup/verify → build → release
  # ---------------------------------------------------------------------------
  version:
    name: Version bump & sync
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PUSH_TOKEN || github.token }}

      - name: Apply release changelog text
        if: >-
          github.event.inputs.bump_version != 'none' &&
          github.event.inputs.release_changelog != ''
        shell: bash
        env:
          CHANGELOG: ${{ github.event.inputs.release_changelog }}
          MOD_INPUT: ${{ github.event.inputs.mod }}
        run: |
          set -euo pipefail
          if [ "$MOD_INPUT" == "all" ]; then
            python3 scripts/version/set-versions-changelog.py --all --text "$CHANGELOG"
          else
            python3 scripts/version/set-versions-changelog.py --mod "$MOD_INPUT" --text "$CHANGELOG"
          fi

      - name: Bump and sync version strings
        if: github.event.inputs.bump_version != 'none'
        shell: pwsh
        env:
          MOD_INPUT: ${{ github.event.inputs.mod }}
          BUMP: ${{ github.event.inputs.bump_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MOD_INPUT -eq 'all') {
            ./scripts/version/pre-push-build.ps1 -All -Bump $env:BUMP -SyncOnly
          } else {
            ./scripts/version/pre-push-build.ps1 -Mod $env:MOD_INPUT -Bump $env:BUMP -SyncOnly
          }

      - name: Verify version consistency
        if: github.event.inputs.bump_version != 'none'
        run: python3 scripts/version/verify-version-consistency.py

      - name: Commit and push version bump
        if: github.event.inputs.bump_version != 'none'
        env:
          MOD_INPUT: ${{ github.event.inputs.mod }}
          BUMP: ${{ github.event.inputs.bump_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/version/stage-version-sync-files.py
          if git diff --staged --quiet; then
            echo "::error::Bump produced no file changes — check bump_version and mod selection"
            exit 1
          fi
          git commit -m "chore(release): bump ${{ github.event.inputs.mod }} ${BUMP} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record commit ref for downstream jobs
        id: meta
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Setup — matrix + version consistency (Python) — shared with Test workflow
  # ---------------------------------------------------------------------------
  setup:
    needs: version
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    uses: ./.github/workflows/reusable-mod-matrix-setup.yml
    with:
      event_name: ${{ github.event_name }}
      test_discord: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_discord == 'true' || false }}
      mod: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mod || 'all' }}
      pull_request_all_mods: ${{ github.event_name == 'pull_request' }}
      ref: ${{ needs.version.outputs.ref || github.sha }}

  # ---------------------------------------------------------------------------
  # Build — self-hosted .NET compile + DLL artifacts
  # ---------------------------------------------------------------------------
  build:
    needs: [setup, validate-localization, version]
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      (needs.validate-localization.result == 'success' || needs.validate-localization.result == 'skipped') &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: [self-hosted, Linux, X64, sunhaven]
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Runner self-check (dispatch)
        if: github.event.inputs.dry_run == 'true' || github.event.inputs.build_only == 'true'
        shell: bash
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.os=${{ runner.os }}"
          if [ "${{ github.event.inputs.build_only }}" == "true" ]; then
            echo "build_only: release job skipped."
          elif [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "dry_run: publish steps skipped in release job."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref || github.sha }}

      - name: Setup .NET SDK
        if: matrix.mod != 'test_discord'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
          DOTNET_ROOT: ${{ runner.temp }}/dotnet

      - name: Set build targets from mod matrix
        if: matrix.mod != 'test_discord'
        id: build_config
        shell: bash
        run: |
          MOD_KEY="${{ matrix.mod }}"
          MOD_JSON="$(jq -c --arg key "$MOD_KEY" '.[] | select(.modKey == $key)' scripts/matrix/mod-matrix.json)"
          if [ -z "$MOD_JSON" ]; then
            echo "❌ Unknown mod: $MOD_KEY"
            exit 1
          fi
          echo "mod_dir=$(echo "$MOD_JSON" | jq -r '.modDir')" >> "$GITHUB_OUTPUT"
          echo "dll_name=$(echo "$MOD_JSON" | jq -r '.dllName')" >> "$GITHUB_OUTPUT"
          echo "csproj=$(echo "$MOD_JSON" | jq -r '.csproj')" >> "$GITHUB_OUTPUT"

      - name: Build mod
        if: matrix.mod != 'test_discord'
        shell: bash
        env:
          BEPINEX_PATH: /sunhaven/BepInEx
          MANAGED_PATH: "/sunhaven/Sun Haven_Data/Managed"
        run: |
          set -euo pipefail
          dotnet restore "${{ steps.build_config.outputs.csproj }}"
          dotnet build "${{ steps.build_config.outputs.csproj }}" -c Release --nologo \
            -p:BepInExPath="$BEPINEX_PATH" \
            -p:ManagedPath="$MANAGED_PATH" \
            -p:SunhavenCopyToBepInExPlugins=false

      # Stage DLLs under builds/<ModDir>/ for upload-artifact (runner-local; not from git).
      - name: Collect build outputs
        if: matrix.mod != 'test_discord'
        shell: bash
        run: |
          set -euo pipefail
          MOD_DIR="${{ steps.build_config.outputs.mod_dir }}"
          DLL_NAME="${{ steps.build_config.outputs.dll_name }}"
          SRC_DLL="$MOD_DIR/bin/Release/net48/$DLL_NAME.dll"
          DEST_DIR="builds/$MOD_DIR"
          mkdir -p "$DEST_DIR"
          test -f "$SRC_DLL" || { echo "❌ Missing $SRC_DLL"; exit 1; }
          cp "$SRC_DLL" "$DEST_DIR/"
          if [ "${{ matrix.mod }}" = "thevault" ]; then
            ABS_SRC="TheVault.Abstractions/bin/Release/netstandard2.0/TheVault.Abstractions.dll"
            test -f "$ABS_SRC" || { echo "❌ Missing $ABS_SRC"; exit 1; }
            cp "$ABS_SRC" "$DEST_DIR/"
          fi

      - name: Upload built DLL artifact
        if: matrix.mod != 'test_discord'
        uses: actions/upload-artifact@v6
        with:
          name: built-${{ matrix.mod }}
          path: builds/${{ steps.build_config.outputs.mod_dir }}/*.dll
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release — single matrix caller of the reusable per-mod release workflow.
  #
  # `always()` in the `if` is REQUIRED: every job that transitively depends on
  # the matrix `build` job is auto-skipped without it (observed across runs
  # #124–#139 — the release jobs showed "skipped / 0 steps" while build-gate and
  # the always() aggregate ran). The explicit needs.*.result checks still gate
  # correctly. The matrix is the same fromJson(setup) the build job uses, so
  # mod=all fans out to all mods and a single-mod dispatch fans out to one.
  # ---------------------------------------------------------------------------
  release:
    name: release (${{ matrix.mod }})
    needs: [setup, build, version]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_only != 'true' &&
      needs.build.result == 'success' &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/reusable-release-mod.yml
    with:
      mod: ${{ matrix.mod }}
      ref: ${{ needs.version.outputs.ref || github.sha }}
      dry_run: ${{ github.event.inputs.dry_run }}
      publish_thunderstore: ${{ github.event.inputs.publish_thunderstore }}
      publish_nexus: ${{ github.event.inputs.publish_nexus }}
      create_github_release: ${{ github.event.inputs.create_github_release }}
      release_anyway: ${{ github.event.inputs.release_anyway }}
      test_discord: ${{ github.event.inputs.test_discord }}
      publish_discord_only: ${{ github.event.inputs.publish_discord_only }}
      ignore_discord_notify: ${{ github.event.inputs.ignore_discord_notify }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Combined report — single human-readable summary (open this job first)
  # ---------------------------------------------------------------------------
  release_aggregate_report:
    name: Combined release report
    needs: [release]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_only != 'true' &&
      needs.release.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download per-mod reports
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: release-report-*
          path: aggregated-reports
          merge-multiple: true

      - name: Write combined summary
        run: |
          set -euo pipefail
          {
            echo "# Combined release report"
            echo ""
            echo "Workflow run: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · ref \`${{ github.ref_name }}\` · event \`${{ github.event_name }}\`"
            echo ""
            echo "Open this **Combined release report** job at the top of the run for all mods in one place. Individual release jobs still include the same section under their own summary."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          ROOT="aggregated-reports"
          mapfile -t FILES < <(find "$ROOT" -type f -name '*.md' 2>/dev/null | sort)
          if [ ! -d "$ROOT" ] || [ "${#FILES[@]}" -eq 0 ]; then
            {
              echo "## No report files"
              echo ""
              echo "No \`release-report-*\` artifacts were found (for example every release job failed before the report step, or artifacts expired)."
              echo ""
              echo "**Release job result:** \`${{ needs.release.result }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Mods in this report (${#FILES[@]})"
            echo ""
            for f in "${FILES[@]}"; do
              base="$(basename "$f" .md)"
              echo "- \`${base}\`"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for f in "${FILES[@]}"; do
            {
              echo "---"
              echo ""
              cat "$f"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------------
  # Discord — published GitHub Release (no checkout; tag → mod dir map)
  # ---------------------------------------------------------------------------
  notify_discord:
    if: github.event_name == 'release' && !startsWith(github.ref_name, 'HavensAlmanac-')
    runs-on: ubuntu-latest
    steps:
      - name: Set mod icon URL from release tag
        id: icon
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then
            exit 0
          fi
          PREFIX="${TAG%-v*}"
          case "$PREFIX" in
            HavensBirthright)           DIR="HavensBirthright" ;;
            SMUT)                       DIR="SunHavenMuseumUtilityTracker" ;;
            SquirrelsBirthdayReminder)  DIR="BirthdayReminder" ;;
            SunHavenTodo)               DIR="SunhavenTodo" ;;
            TheVault)                   DIR="TheVault" ;;
            HavenDevTools)              DIR="HavenDevTools" ;;
            SenpaisChest)               DIR="SenpaisChest" ;;
            HavensAlmanac)              DIR="HavensAlmanac" ;;
            FasterRaces)                DIR="FasterRaces" ;;
            TrinketFortune)             DIR="TrinketFortune" ;;
            CropOptimizer)              DIR="CropOptimizer" ;;
            HavensRespec)               DIR="HavensRespec" ;;
            *)                          DIR="" ;;
          esac
          if [ -n "$DIR" ]; then
            echo "url=https://raw.githubusercontent.com/${{ github.repository }}/main/$DIR/thunderstore/icon.png" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release → Discord
        uses: AzraelGodKing/Discord_Release@main
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "2105893"
          username: "Sun Haven Mods"
          reduce_headings: true
          thumbnail_url: ${{ steps.icon.outputs.url }}
