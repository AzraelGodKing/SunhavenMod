# =============================================================================
# Mod CI/CD Pipeline: Package → GitHub Release → Thunderstore + Nexus (Manual)
# =============================================================================
# TRIGGER: Manual workflow dispatch - select which mod to release/publish
#
# IMPORTANT: This workflow packages PRE-BUILT DLLs. You must:
#   1. Build your mod locally
#   2. Copy the DLL to builds/{ModName}/{ModName}.dll
#   3. Commit and push
#   4. Then run this workflow
#
# WHAT IT DOES:
#   1. Packages the Thunderstore-ready zip (manifest.json, README, icon, DLL(s); The Vault also includes TheVault.Abstractions.dll)
#   2. Creates a GitHub Release with the zip attached (optional)
#   3. Optionally publishes to Thunderstore (manual checkbox)
#   4. Optionally uploads to Nexus Mods (manual checkbox; needs NEXUSMODS_API_KEY)
#      Haven's Almanac: Nexus is always skipped; workflow logs a positive note; no Discord pings.
#
# SETUP REQUIRED:
#   1. Thunderstore: THUNDERSTORE_TOKEN (Service Account token)
#   2. Nexus Mods (optional): NEXUSMODS_API_KEY from https://www.nexusmods.com/users/myaccount?tab=api
#      Add nexus_file_group_id to docs/versions.json for mods you want to upload to Nexus
#      Use Nexus-Mods/upload-action v1.0.0-beta.3+ (Nexus API wraps JSON in { data }; beta.2 throws on .length)
#   3. The Vault breaking vault saves: TheVault/SAVE_COMPATIBILITY.md — set vault_save_breaking + banner in versions.json,
#      README callout, VaultSaveCompatibility.cs, thunderstore README; CI prepends banner to published description/changelog.
# =============================================================================

name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'Which mod to release'
        required: true
        type: choice
        options:
          - all
          - havensbirthright
          - sunhavenmuseumutilitytracker
          - squirrelsbirthdayreminder
          - sunhaventodo
          - thevault
          - havendevtools
          - senpaischest
          - havensalmanac
          - fasterraces
          - trinketfortune
      publish_thunderstore:
        description: 'Publish to Thunderstore after release?'
        required: true
        type: boolean
        default: true
      publish_nexus:
        description: 'Upload to Nexus Mods? (requires NEXUSMODS_API_KEY + nexus_file_group_id in versions.json)'
        required: false
        type: boolean
        default: false
      create_github_release:
        description: 'Create GitHub Release?'
        required: true
        type: boolean
        default: true
      test_discord:
        description: 'Test Discord notification only (fake mod, no GitHub/Thunderstore release)'
        required: false
        type: boolean
        default: false
  release:
    types: [published]

env:
  THUNDERSTORE_NAMESPACE: "AzraelGodKing"
  THUNDERSTORE_COMMUNITY: "sun-haven"
  THUNDERSTORE_CATEGORIES: "mods"
  THUNDERSTORE_DEPS: "BepInEx-BepInExPack@5.4.2100"

jobs:
  # --------------------------------------------------------------------
  # SETUP — Determine which mod(s) to release
  # --------------------------------------------------------------------
  setup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set mod matrix
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.test_discord }}" == "true" ]; then
            echo 'matrix=["test_discord"]' >> "$GITHUB_OUTPUT"
          else
            MOD_KEY="${{ github.event.inputs.mod }}"
            if [ "$MOD_KEY" == "all" ]; then
              echo 'matrix=["havensbirthright","sunhavenmuseumutilitytracker","squirrelsbirthdayreminder","sunhaventodo","thevault","havendevtools","senpaischest","havensalmanac","fasterraces","trinketfortune"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$MOD_KEY\"]" >> "$GITHUB_OUTPUT"
            fi
          fi

  # --------------------------------------------------------------------
  # RELEASE — Package, release, and optionally publish each mod
  # --------------------------------------------------------------------
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      # ------------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. LOAD MOD CONFIG
      # ------------------------------------------------------------------
      - name: Set mod configuration
        id: config
        run: |
          MOD_KEY="${{ matrix.mod }}"

          if [ "$MOD_KEY" == "test_discord" ]; then
            echo "json_key=test_discord" >> "$GITHUB_OUTPUT"
            echo "mod_dir=TestDiscord" >> "$GITHUB_OUTPUT"
            echo "dll_name=TestDiscord" >> "$GITHUB_OUTPUT"
            echo "thunderstore_name=TestDiscord" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-test" >> "$GITHUB_OUTPUT"
            echo "display_name=Test Discord Notification" >> "$GITHUB_OUTPUT"
            echo "description=Test run" >> "$GITHUB_OUTPUT"
            echo "changelog=Workflow test. No GitHub Release or Thunderstore publish." >> "$GITHUB_OUTPUT"
            echo "skip_discord_for_almanac=false" >> "$GITHUB_OUTPUT"
            echo "Test mode: fake mod data set"
            exit 0
          fi

          # Map input to versions.json key and project details
          case "$MOD_KEY" in
            "havensbirthright")
              JSON_KEY="com.azraelgodking.havensbirthright"
              MOD_DIR="HavensBirthright"
              DLL_NAME="HavensBirthright"
              THUNDERSTORE_NAME="HavensBirthright"
              ;;
            "sunhavenmuseumutilitytracker")
              JSON_KEY="com.azraelgodking.sunhavenmuseumutilitytracker"
              MOD_DIR="SunHavenMuseumUtilityTracker"
              DLL_NAME="SunHavenMuseumUtilityTracker"
              THUNDERSTORE_NAME="SMUT"
              ;;
            "squirrelsbirthdayreminder")
              JSON_KEY="com.azraelgodking.squirrelsbirthdayreminder"
              MOD_DIR="BirthdayReminder"
              DLL_NAME="BirthdayReminder"
              THUNDERSTORE_NAME="SquirrelsBirthdayReminder"
              ;;
            "sunhaventodo")
              JSON_KEY="com.azraelgodking.sunhaventodo"
              MOD_DIR="SunhavenTodo"
              DLL_NAME="SunhavenTodo"
              THUNDERSTORE_NAME="SunHavenTodo"
              ;;
            "thevault")
              JSON_KEY="com.azraelgodking.thevault"
              MOD_DIR="TheVault"
              DLL_NAME="TheVault"
              THUNDERSTORE_NAME="TheVault"
              ;;
            "havendevtools")
              JSON_KEY="com.azraelgodking.havendevtools"
              MOD_DIR="HavenDevTools"
              DLL_NAME="HavenDevTools"
              THUNDERSTORE_NAME="HavenDevTools"
              ;;
            "senpaischest")
              JSON_KEY="com.azraelgodking.senpaischest"
              MOD_DIR="SenpaisChest"
              DLL_NAME="SenpaisChest"
              THUNDERSTORE_NAME="SenpaisChest"
              ;;
            "havensalmanac")
              JSON_KEY="com.azraelgodking.havensalmanac"
              MOD_DIR="HavensAlmanac"
              DLL_NAME="HavensAlmanac"
              THUNDERSTORE_NAME="HavensAlmanac"
              ;;
            "fasterraces")
              JSON_KEY="com.azraelgodking.fasterraces"
              MOD_DIR="FasterRaces"
              DLL_NAME="FasterRaces"
              THUNDERSTORE_NAME="FasterRaces"
              ;;
            "trinketfortune")
              JSON_KEY="com.azraelgodking.trinketfortune"
              MOD_DIR="TrinketFortune"
              DLL_NAME="TrinketFortune"
              THUNDERSTORE_NAME="TrinketFortune"
              ;;
            *)
              echo "❌ Unknown mod: $MOD_KEY"
              exit 1
              ;;
          esac

          # Read version, name, description, changelog, and links from versions.json
          VERSION=$(jq -r ".[\"$JSON_KEY\"].version" docs/versions.json)
          MOD_DISPLAY_NAME=$(jq -r ".[\"$JSON_KEY\"].name" docs/versions.json)
          MOD_DESCRIPTION=$(jq -r ".[\"$JSON_KEY\"].description" docs/versions.json)
          CHANGELOG=$(jq -r ".[\"$JSON_KEY\"].changelog" docs/versions.json)
          VAULT_SAVE_BREAKING=$(jq -r ".[\"$JSON_KEY\"].vault_save_breaking // false" docs/versions.json)
          VAULT_BREAKING_BANNER=$(jq -r ".[\"$JSON_KEY\"].vault_breaking_banner // \"\"" docs/versions.json)
          NEXUS_URL=$(jq -r ".[\"$JSON_KEY\"].nexus // \"\"" docs/versions.json)
          NEXUS_FILE_GROUP_ID=$(jq -r ".[\"$JSON_KEY\"].nexus_file_group_id // empty" docs/versions.json)
          THUNDERSTORE_URL=$(jq -r ".[\"$JSON_KEY\"].thunderstore // \"\"" docs/versions.json)

          if [ -z "$NEXUS_FILE_GROUP_ID" ] || [ "$NEXUS_FILE_GROUP_ID" == "null" ]; then
            NEXUS_FILE_GROUP_ID=""
            if [ -n "$NEXUS_URL" ] && [ "$NEXUS_URL" != "null" ]; then
              NEXUS_FILE_GROUP_ID=$(echo "$NEXUS_URL" | sed -n 's|.*/mods/\([0-9]*\)$|\1|p')
            fi
          fi

          # Haven's Almanac: no Nexus page — never upload; skip Discord (Thunderstore/GitHub only)
          SKIP_DISCORD_FOR_ALMANAC=false
          if [ "$JSON_KEY" == "com.azraelgodking.havensalmanac" ]; then
            NEXUS_FILE_GROUP_ID=""
            SKIP_DISCORD_FOR_ALMANAC=true
          fi

          echo "json_key=$JSON_KEY" >> "$GITHUB_OUTPUT"
          echo "mod_dir=$MOD_DIR" >> "$GITHUB_OUTPUT"
          echo "dll_name=$DLL_NAME" >> "$GITHUB_OUTPUT"
          echo "thunderstore_name=$THUNDERSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display_name=$MOD_DISPLAY_NAME" >> "$GITHUB_OUTPUT"
          echo "description=$MOD_DESCRIPTION" >> "$GITHUB_OUTPUT"
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "nexus_url=$NEXUS_URL" >> "$GITHUB_OUTPUT"
          echo "nexus_file_group_id=$NEXUS_FILE_GROUP_ID" >> "$GITHUB_OUTPUT"
          echo "thunderstore_url=$THUNDERSTORE_URL" >> "$GITHUB_OUTPUT"
          echo "skip_discord_for_almanac=$SKIP_DISCORD_FOR_ALMANAC" >> "$GITHUB_OUTPUT"

          echo "📦 Packaging: $MOD_DISPLAY_NAME v$VERSION"
          echo "   Description: $MOD_DESCRIPTION"
          echo "   Looking for: builds/$MOD_DIR/$DLL_NAME.dll"

      # ------------------------------------------------------------------
      # 3. VERSION CHECK — Skip if current version already released
      # ------------------------------------------------------------------
      - name: Check version against last release
        id: version_check
        run: |
          THUNDERSTORE_NAME="${{ steps.config.outputs.thunderstore_name }}"
          CURRENT_VERSION="${{ steps.config.outputs.version }}"
          MOD_DISPLAY_NAME="${{ steps.config.outputs.display_name }}"

          if [ "$THUNDERSTORE_NAME" == "TestDiscord" ]; then
            echo "Test mode: skipping version check, proceeding"
            echo "version_unchanged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch releases, filter by mod prefix, get latest by published_at, parse version from tag
          LAST_RELEASE_JSON=$(curl -sSf -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases?per_page=100" | \
            jq -r --arg prefix "${THUNDERSTORE_NAME}-v" '[.[] | select(.tag_name | startswith($prefix))] | sort_by(.published_at) | reverse | .[0] // empty')

          if [ -z "$LAST_RELEASE_JSON" ] || [ "$LAST_RELEASE_JSON" == "null" ]; then
            echo "No previous release found for $THUNDERSTORE_NAME - proceeding with release"
            echo "version_unchanged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_VERSION=$(echo "$LAST_RELEASE_JSON" | jq -r '.tag_name | split("-v")[1]')
          echo "Last released version: $LAST_VERSION"
          echo "Current version:       $CURRENT_VERSION"

          if [ "$LAST_VERSION" == "$CURRENT_VERSION" ]; then
            echo "version_unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed ($LAST_VERSION -> $CURRENT_VERSION) - proceeding with release"
            echo "version_unchanged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No version change - skipping release
        if: steps.version_check.outputs.version_unchanged == 'true'
        run: |
          echo "✅ No Version Change - ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }} already released, skipping"

      # ------------------------------------------------------------------
      # 4. PACKAGE — Assemble Thunderstore-compatible zip
      # ------------------------------------------------------------------
      - name: Package mod for distribution
        if: steps.version_check.outputs.version_unchanged != 'true'
        env:
          PACKAGE_MANIFEST_DESCRIPTION: ${{ steps.config.outputs.description }}
        run: |
          mkdir -p dist/package

          if [ "${{ matrix.mod }}" == "test_discord" ]; then
            echo "Test run - no real package" > dist/package/readme.txt
            cd dist/package
            zip -r "../TestDiscord-0.0.0-test.zip" .
            echo "Minimal test package created: TestDiscord-0.0.0-test.zip"
            exit 0
          fi

          # Look for pre-built DLL in builds folder
          DLL_PATH="builds/${{ steps.config.outputs.mod_dir }}/${{ steps.config.outputs.dll_name }}.dll"

          if [ ! -f "$DLL_PATH" ]; then
            echo "❌ DLL not found at: $DLL_PATH"
            echo ""
            echo "Please build your mod locally and commit the DLL:"
            echo "  1. Build in Visual Studio/Rider"
            echo "  2. Copy DLL to: builds/${{ steps.config.outputs.mod_dir }}/"
            echo "  3. git add builds/ && git commit -m 'Update ${{ steps.config.outputs.dll_name }} build' && git push"
            echo "  4. Re-run this workflow"
            exit 1
          fi

          echo "📄 Found DLL: $DLL_PATH"
          cp "$DLL_PATH" dist/package/

          # The Vault loads the abstractions assembly from the same folder; ship it in the zip.
          if [ "${{ matrix.mod }}" = "thevault" ]; then
            ABS_PATH="builds/${{ steps.config.outputs.mod_dir }}/TheVault.Abstractions.dll"
            if [ -f "$ABS_PATH" ]; then
              cp "$ABS_PATH" dist/package/
              echo "📄 Also packaged: $ABS_PATH"
            else
              echo "❌ The Vault Thunderstore package requires TheVault.Abstractions.dll next to TheVault.dll"
              echo "   Expected: $ABS_PATH"
              echo "   Build TheVault.csproj and copy both DLLs to builds/${{ steps.config.outputs.mod_dir }}/"
              exit 1
            fi
          fi

          # Use thunderstore folder from mod directory
          THUNDERSTORE_DIR="${{ steps.config.outputs.mod_dir }}/thunderstore"

          echo "📁 Using Thunderstore assets from: $THUNDERSTORE_DIR"

          # Copy Thunderstore metadata files
          if [ -f "$THUNDERSTORE_DIR/manifest.json" ]; then
            cp "$THUNDERSTORE_DIR/manifest.json" dist/package/
          else
            echo "⚠️ No manifest.json found - creating minimal one"
            cat > dist/package/manifest.json << EOF
          {
            "name": "${{ steps.config.outputs.thunderstore_name }}",
            "version_number": "${{ steps.config.outputs.version }}",
            "website_url": "",
            "description": "${{ steps.config.outputs.description }}",
            "dependencies": ["BepInEx-BepInExPack-5.4.2100"]
          }
          EOF
          fi

          ICON_SRC=""
          if [ -f "$THUNDERSTORE_DIR/icon.png" ]; then
            ICON_SRC="$THUNDERSTORE_DIR/icon.png"
          elif [ -f "builds/${{ steps.config.outputs.mod_dir }}/icon.png" ]; then
            ICON_SRC="builds/${{ steps.config.outputs.mod_dir }}/icon.png"
          fi
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" dist/package/icon.png
            echo "📷 icon.png from: $ICON_SRC"
          else
            echo "❌ icon.png is required for Thunderstore (put it in $THUNDERSTORE_DIR or builds/${{ steps.config.outputs.mod_dir }}/)"
            exit 1
          fi

          if [ -f "$THUNDERSTORE_DIR/README.md" ]; then
            cp "$THUNDERSTORE_DIR/README.md" dist/package/
          elif [ -f "${{ steps.config.outputs.mod_dir }}/README.md" ]; then
            cp "${{ steps.config.outputs.mod_dir }}/README.md" dist/package/README.md
            echo "📄 Using ${{ steps.config.outputs.mod_dir }}/README.md as package readme"
          fi

          # Thunderstore manifest description matches publish text (incl. vault breaking banner from versions.json)
          if [ -f dist/package/manifest.json ] && command -v jq >/dev/null 2>&1; then
            jq --arg d "$PACKAGE_MANIFEST_DESCRIPTION" '.description = $d' dist/package/manifest.json > dist/package/manifest.json.__new__ \
              && mv dist/package/manifest.json.__new__ dist/package/manifest.json
            echo "📋 manifest description synced to CI publish string"
          fi

          # Update the version in manifest.json to match versions.json
          cd dist/package
          if [ -f manifest.json ]; then
            sed -i "s/\"version_number\": \".*\"/\"version_number\": \"${{ steps.config.outputs.version }}\"/" manifest.json
            echo "📋 manifest.json contents:"
            cat manifest.json
          fi

          # Create the zip
          ZIP_NAME="${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip"
          zip -r "../$ZIP_NAME" .

          echo "✅ Package created: $ZIP_NAME"
          ls -lh "../$ZIP_NAME"

      # ------------------------------------------------------------------
      # 5. GITHUB RELEASE (Optional)
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        if: github.event.inputs.create_github_release == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.config.outputs.thunderstore_name }}-v${{ steps.config.outputs.version }}"
          name: "${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}"
          body: |
            ## ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}

            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Installation
            - **Thunderstore**: Install via r2modman or Thunderstore app
            - **Nexus**: Download the zip below and extract to your BepInEx/plugins folder
            - **Manual**: Extract the DLL to `Sun Haven/BepInEx/plugins/`
          files: |
            dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip
          draft: false
          prerelease: false

      # ------------------------------------------------------------------
      # 5b. NEXUS MODS UPLOAD (optional)
      # ------------------------------------------------------------------
      - name: Haven's Almanac — Nexus skipped (Thunderstore & GitHub only)
        if: matrix.mod == 'havensalmanac' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true'
        run: |
          echo "⭐ Haven's Almanac is not on Nexus Mods yet — Nexus upload is intentionally skipped."
          echo "   Releases still go through GitHub and Thunderstore. Thanks for shipping the Almanac! 📚✨"

      - name: Upload to Nexus Mods
        if: github.event.inputs.publish_nexus == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.nexus_file_group_id != ''
        uses: Nexus-Mods/upload-action@v1.0.0-beta.3
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ steps.config.outputs.nexus_file_group_id }}
          filename: dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip
          version: ${{ steps.config.outputs.version }}
          display_name: ${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}
          description: |
            ${{ steps.config.outputs.description }}

            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Installation
            Extract the contents to your Sun Haven BepInEx/plugins folder.
          file_category: main

      # ------------------------------------------------------------------
      # 5c. NOTIFY DISCORD (when we created a release in this workflow run)
      # ------------------------------------------------------------------
      - name: Notify Discord (release created by workflow)
        if: github.event.inputs.create_github_release == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true' && steps.config.outputs.skip_discord_for_almanac != 'true'
        uses: AzraelGodKing/Discord_Release@main
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "2105893"
          username: "Sun Haven Mods"
          reduce_headings: true
          title: "${{ steps.config.outputs.display_name }} v${{ steps.config.outputs.version }}"
          body: |
            ### Changes
            ${{ steps.config.outputs.changelog }}

            ### Download
            - **Nexus Mods**: ${{ steps.config.outputs.nexus_url }}
            - **Thunderstore**: ${{ steps.config.outputs.thunderstore_url }}
            - **GitHub Release**: Download the zip below and extract to BepInEx/plugins
            - **Manual**: Extract the DLL to `Sun Haven/BepInEx/plugins/`
          thumbnail_url: "https://raw.githubusercontent.com/${{ github.repository }}/main/${{ steps.config.outputs.mod_dir }}/thunderstore/icon.png"

      # ------------------------------------------------------------------
      # 6. THUNDERSTORE PUBLISH (Manual opt-in)
      # ------------------------------------------------------------------
      - name: Publish to Thunderstore
        if: github.event.inputs.publish_thunderstore == 'true' && github.event.inputs.test_discord != 'true' && steps.version_check.outputs.version_unchanged != 'true'
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          namespace: ${{ env.THUNDERSTORE_NAMESPACE }}
          name: ${{ steps.config.outputs.thunderstore_name }}
          description: ${{ steps.config.outputs.description }}
          version: ${{ steps.config.outputs.version }}
          community: ${{ env.THUNDERSTORE_COMMUNITY }}
          repo: thunderstore.io
          categories: |
            ${{ env.THUNDERSTORE_CATEGORIES }}
          deps: ${{ env.THUNDERSTORE_DEPS }}
          file: dist/${{ steps.config.outputs.thunderstore_name }}-${{ steps.config.outputs.version }}.zip

      # ------------------------------------------------------------------
      # 7. TEST MODE — Post to Discord only (no GitHub Release / Thunderstore)
      # Randomly picks a mod to simulate so the test looks realistic
      # ------------------------------------------------------------------
      - name: Pick random mod for test
        if: github.event.inputs.test_discord == 'true'
        id: test_mod
        run: |
          MODS=(
            "com.azraelgodking.havensbirthright:HavensBirthright"
            "com.azraelgodking.sunhavenmuseumutilitytracker:SunHavenMuseumUtilityTracker"
            "com.azraelgodking.squirrelsbirthdayreminder:BirthdayReminder"
            "com.azraelgodking.sunhaventodo:SunhavenTodo"
            "com.azraelgodking.thevault:TheVault"
            "com.azraelgodking.havendevtools:HavenDevTools"
            "com.azraelgodking.senpaischest:SenpaisChest"
            "com.azraelgodking.havensalmanac:HavensAlmanac"
            "com.azraelgodking.fasterraces:FasterRaces"
            "com.azraelgodking.trinketfortune:TrinketFortune"
          )
          IDX=$((RANDOM % ${#MODS[@]}))
          ENTRY="${MODS[$IDX]}"
          JSON_KEY="${ENTRY%%:*}"
          MOD_DIR="${ENTRY##*:}"
          NAME=$(jq -r ".[\"$JSON_KEY\"].name" docs/versions.json)
          VERSION=$(jq -r ".[\"$JSON_KEY\"].version" docs/versions.json)
          CHANGELOG=$(jq -r ".[\"$JSON_KEY\"].changelog" docs/versions.json)
          echo "title=Test – $NAME v$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "### Changes"
            echo "$CHANGELOG"
            echo ""
            echo "— *Test run. No real release.*"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "icon_url=https://raw.githubusercontent.com/${{ github.repository }}/main/$MOD_DIR/thunderstore/icon.png" >> "$GITHUB_OUTPUT"

      - name: Post test notification to Discord
        if: github.event.inputs.test_discord == 'true'
        uses: AzraelGodKing/Discord_Release@main
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: ${{ steps.test_mod.outputs.title }}
          body: ${{ steps.test_mod.outputs.body }}
          thumbnail_url: ${{ steps.test_mod.outputs.icon_url }}
          username: "Sun Haven Mods"

  # --------------------------------------------------------------------
  # NOTIFY DISCORD — When a release is published (triggered by release event)
  # Uses mod icon from thunderstore folder (raw GitHub URL)
  # --------------------------------------------------------------------
  notify_discord:
    if: ${{ github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'HavensAlmanac-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Set mod icon URL
        id: icon
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PREFIX="${TAG%-v*}"
          case "$PREFIX" in
            HavensBirthright)           DIR="HavensBirthright" ;;
            SMUT)                       DIR="SunHavenMuseumUtilityTracker" ;;
            SquirrelsBirthdayReminder)  DIR="BirthdayReminder" ;;
            SunHavenTodo)               DIR="SunhavenTodo" ;;
            TheVault)                   DIR="TheVault" ;;
            HavenDevTools)              DIR="HavenDevTools" ;;
            SenpaisChest)               DIR="SenpaisChest" ;;
            HavensAlmanac)              DIR="HavensAlmanac" ;;
            FasterRaces)                DIR="FasterRaces" ;;
            TrinketFortune)             DIR="TrinketFortune" ;;
            *)                          DIR="" ;;
          esac
          if [ -n "$DIR" ]; then
            echo "url=https://raw.githubusercontent.com/${{ github.repository }}/main/$DIR/thunderstore/icon.png" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release to Discord
        uses: AzraelGodKing/Discord_Release@main
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "2105893"
          username: "Sun Haven Mods"
          reduce_headings: true
          thumbnail_url: ${{ steps.icon.outputs.url }}
