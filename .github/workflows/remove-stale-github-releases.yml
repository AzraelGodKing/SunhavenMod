# =============================================================================
# Remove GitHub Releases and keep only latest 3
# =============================================================================
# Scans all repository releases (not per-mod) and keeps only the 3 newest.
# Deletes older releases and their corresponding git tags.
#
# SAFETY: Default run is dry-run only. To actually delete, turn OFF dry_run and
# turn ON confirm_delete in the workflow dispatch form.
# =============================================================================

name: Remove stale GitHub releases

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list stale releases only (no API deletes)'
        type: boolean
        default: true
      confirm_delete:
        description: 'Perform deletion (ignored if dry_run is true)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: remove-stale-github-releases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Preview releases to delete (dry run)
        if: ${{ inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          KEEP_COUNT=3

          gh api --paginate "repos/$REPO/releases?per_page=100" > all_releases.json
          TOTAL="$(jq 'length' all_releases.json)"
          echo "Found $TOTAL total release(s). Keeping newest $KEEP_COUNT."

          jq -c 'sort_by(.published_at // .created_at) | reverse | .[3:][]' all_releases.json > to_delete.jsonl || true
          DELETE_COUNT="$(wc -l < to_delete.jsonl | tr -d ' ')"

          if [ "$DELETE_COUNT" = "0" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          echo "Would delete $DELETE_COUNT release(s):"
          while IFS= read -r rel; do
            ID="$(echo "$rel" | jq -r '.id')"
            TAG="$(echo "$rel" | jq -r '.tag_name')"
            NAME="$(echo "$rel" | jq -r '.name // "<no name>"')"
            PUB="$(echo "$rel" | jq -r '.published_at // .created_at // "<unknown>"')"
            echo "- id=$ID tag=$TAG name=$NAME published=$PUB"
          done < to_delete.jsonl

      - name: Delete old releases (keep latest 3)
        if: ${{ !inputs.dry_run && inputs.confirm_delete }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          KEEP_COUNT=3

          gh api --paginate "repos/$REPO/releases?per_page=100" > all_releases.json
          TOTAL="$(jq 'length' all_releases.json)"
          echo "Found $TOTAL total release(s). Keeping newest $KEEP_COUNT."

          jq -c 'sort_by(.published_at // .created_at) | reverse | .[3:][]' all_releases.json > to_delete.jsonl || true
          DELETE_COUNT="$(wc -l < to_delete.jsonl | tr -d ' ')"

          if [ "$DELETE_COUNT" = "0" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          echo "Deleting $DELETE_COUNT release(s)..."
          while IFS= read -r rel; do
            ID="$(echo "$rel" | jq -r '.id')"
            TAG="$(echo "$rel" | jq -r '.tag_name')"
            NAME="$(echo "$rel" | jq -r '.name // "<no name>"')"
            echo "Deleting release id=$ID tag=$TAG name=$NAME"
            gh api -X DELETE "repos/$REPO/releases/$ID"

            if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
              echo "Deleting tag ref tags/$TAG"
              gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" || echo "Tag refs/tags/$TAG already missing"
            fi
          done < to_delete.jsonl

      - name: Block unsafe run
        if: ${{ !inputs.dry_run && !inputs.confirm_delete }}
        run: |
          echo "::error::Unsafe options: you turned off dry_run but did not set confirm_delete. Enable confirm_delete to delete, or enable dry_run to only list."
          exit 1
