name: Update Mod Download Stats

on:
  schedule:
    # Hourly at :00 UTC (paired with same-hour short-circuit in scripts/fetch-stats.js)
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch even if cache was already updated this UTC hour"
        required: false
        default: false
        type: boolean

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PUSH_TOKEN || github.token }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest stats
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          STATS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: npm run stats

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/stats-cache.json
          git diff --cached --quiet || git commit -m "chore: update mod download stats [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
