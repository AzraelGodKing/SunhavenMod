# Shared by Release & Publish and Test — Self-hosted Sunhaven runner.
# Keeps matrix + verify-version-consistency in one place (avoid drift).
name: Reusable — mod matrix setup

on:
  workflow_call:
    inputs:
      event_name:
        description: 'github.event_name value from caller'
        type: string
        required: true
      test_discord:
        description: 'true when dispatch requests Discord-only matrix row'
        type: boolean
        required: false
        default: false
      mod:
        description: 'workflow_dispatch mod choice (ignored for pull_request)'
        type: string
        required: false
        default: 'all'
      pull_request_all_mods:
        description: 'When true, matrix is all mods (PR gate)'
        type: boolean
        required: false
        default: false
    outputs:
      matrix:
        description: 'JSON array string for strategy.matrix.mod'
        value: ${{ jobs.setup.outputs.matrix }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (mod-matrix doc sync check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: docs/mod-matrix.json must match scripts/mod-matrix.json
        run: |
          node scripts/sync-docs-mod-matrix.js
          git diff --exit-code docs/mod-matrix.json

      - name: Verify version consistency (versions.json vs PLUGIN_VERSION vs manifest)
        run: python3 scripts/verify-version-consistency.py

      - name: Set mod matrix
        id: set-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ inputs.event_name }}
          TEST_DISCORD: ${{ inputs.test_discord }}
          MOD_INPUT: ${{ inputs.mod }}
          PR_ALL: ${{ inputs.pull_request_all_mods }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" == "pull_request" ] || [ "$PR_ALL" == "true" ]; then
            echo "PR / gate build: all mods."
            echo "matrix=$(jq -c '[.[].modKey]' scripts/mod-matrix.json)" >> "$GITHUB_OUTPUT"
          elif [ "$TEST_DISCORD" == "true" ]; then
            echo 'matrix=["test_discord"]' >> "$GITHUB_OUTPUT"
          else
            MOD_KEY="$MOD_INPUT"
            if [ "$MOD_KEY" == "all" ]; then
              echo "matrix=$(jq -c '[.[].modKey]' scripts/mod-matrix.json)" >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$MOD_KEY\"]" >> "$GITHUB_OUTPUT"
            fi
          fi
