name: Draft Self-Hosted Preflight + Build (Template)

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "Mod key for build script"
        required: true
        type: choice
        options:
          - senpaischest
          - havensbirthright
          - sunhavenmuseumutilitytracker
          - squirrelsbirthdayreminder
          - sunhaventodo
          - thevault
          - havendevtools
          - havensalmanac
          - fasterraces
          - trinketfortune

jobs:
  preflight_build:
    runs-on: [self-hosted, windows, sunhaven-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Sun Haven references
        shell: pwsh
        env:
          SUNHAVEN_PATH: C:\sunhaven-refs
        run: |
          ./scripts/build/check-sunhaven-refs.ps1

      - name: Verify version alignment
        shell: pwsh
        run: |
          ./scripts/version/check-version-drift.ps1

      - name: Build selected mod only
        shell: pwsh
        env:
          SUNHAVEN_PATH: C:\sunhaven-refs
        run: |
          ./scripts/version/pre-push-build.ps1 -Mod "${{ github.event.inputs.mod }}" -BuildOnly
